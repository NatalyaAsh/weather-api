name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      
      - name: Download dependencies
        run: go mod download
      
      - name: Build
        run: go build -o /dev/null ./cmd/...
      
      - name: Run tests
        run: go test -v ./...
      
      - name: Run vet
        run: go vet ./...